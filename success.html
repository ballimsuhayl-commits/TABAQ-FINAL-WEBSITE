<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TABAQ — Order confirmation</title><style>:root{--ink:#111;--paper:#f4f2ec;--white:#fff;--line:#d9d6cf;--muted:#6d6b66;--coral:#ff4d3f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;line-height:1.5}a{color:inherit}.shell{max-width:1120px;margin:auto;padding:0 24px}.header{border-bottom:1px solid var(--line);background:rgba(244,242,236,.96);position:sticky;top:0;z-index:10}.header .shell{height:76px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:30px;font-weight:900;letter-spacing:-.06em;text-decoration:none}.nav{display:flex;gap:18px;flex-wrap:wrap}.nav a{font-size:13px;font-weight:800;text-decoration:none}.hero{padding:78px 0 36px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;margin:0 0 14px}.hero h1{font-size:clamp(48px,7vw,96px);line-height:.86;letter-spacing:-.07em;text-transform:uppercase;margin:0;max-width:900px}.hero p{font-size:18px;font-weight:700;color:#4e4a44;max-width:760px}.content{padding:10px 0 84px}.card{background:#fff;border:1px solid var(--line);padding:28px;margin:14px 0}.card h2{font-size:28px;letter-spacing:-.035em;margin:0 0 12px}.card h3{font-size:18px;margin:22px 0 8px}.card p,.card li{font-size:15px;color:#3e3b36}.card strong{color:#111}.notice{border-left:5px solid var(--coral);background:#fff;padding:18px 20px;margin:24px 0;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.footer{background:#111;color:#fff;padding:30px 0}.footer .shell{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.footer a{color:#fff;font-weight:800}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;min-height:46px;padding:10px 12px;font:inherit}.button{border:0;background:#111;color:#fff;padding:14px 20px;border-radius:999px;font-weight:900;cursor:pointer}.status{font-size:14px;font-weight:800;min-height:22px;margin-top:10px}.status.ok{color:#17683d}.status.err{color:#9d1b1b}.muted{color:var(--muted);font-size:13px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;letter-spacing:.1em;text-transform:uppercase}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#eee8df;padding:2px 6px;border-radius:5px}@media(max-width:720px){.header .shell{height:auto;padding-top:18px;padding-bottom:18px;align-items:flex-start}.nav{justify-content:flex-end}.grid,.form{grid-template-columns:1fr}.field.full{grid-column:1}.card{padding:20px}.hero{padding-top:52px}}
.status-card{background:#fff;border:1px solid var(--line);padding:30px;max-width:760px}.status-badge{display:inline-flex;padding:8px 12px;border-radius:999px;background:#f0ece4;font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.status-badge.paid{background:#dff4e7;color:#17683d}.status-badge.pending{background:#fff1cc;color:#7a5414}</style></head><body><header class="header"><div class="shell"><a class="brand" href="index.html">TABAQ</a><nav class="nav"><a href="index.html#shop">Shop</a><a href="contact.html">Contact</a></nav></div></header><main><section class="hero"><div class="shell"><p class="eyebrow">TABAQ checkout</p><h1 id="headline">Confirming your order.</h1><p id="lead">We are checking the secure payment status before confirming the order.</p></div></section><section class="content"><div class="shell"><div class="status-card"><span class="status-badge pending" id="badge">Checking</span><h2 id="statusTitle">Payment verification in progress</h2><p id="statusText">Keep this page open for a moment.</p><p id="orderRef"></p><a class="button" href="index.html#shop" style="display:inline-flex;text-decoration:none;margin-top:16px">Back to TABAQ</a></div></div></section></main><script>
(async()=>{const p=new URLSearchParams(location.search),session=p.get('session_id'),order=p.get('order_id'),badge=document.getElementById('badge'),title=document.getElementById('statusTitle'),text=document.getElementById('statusText'),ref=document.getElementById('orderRef'),headline=document.getElementById('headline'),lead=document.getElementById('lead');ref.textContent=order?'Order reference: '+order:'';if(!session||!order){badge.textContent='Reference needed';title.textContent='We could not verify this page';text.textContent='Use the contact page if you need help with an order.';return;}try{const r=await fetch('/api/order-status?order_id='+encodeURIComponent(order)+'&session_id='+encodeURIComponent(session));const j=await r.json();if(!r.ok)throw new Error(j.message||'Verification unavailable');if(j.paid){badge.textContent='Paid';badge.className='status-badge paid';headline.textContent='Order received.';lead.textContent='Your secure payment has been confirmed.';title.textContent='Thank you for your TABAQ order.';text.textContent='We will use the delivery details supplied during checkout to fulfil your order.';localStorage.removeItem('tabaq_cart_v233');localStorage.removeItem('tabaq_cart_v232');localStorage.removeItem('tabaq_cart_v226');}else{badge.textContent='Confirming';badge.className='status-badge pending';title.textContent='Payment is still being confirmed';text.textContent='Do not submit a second payment. If this status does not update, contact TABAQ with your order reference.';}}catch(e){badge.textContent='Confirming';badge.className='status-badge pending';title.textContent='We are still confirming the payment';text.textContent='Your reference has been preserved. Please do not pay again; contact TABAQ if you need assistance.';}})();
</script></body></html>
