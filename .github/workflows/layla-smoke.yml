name: Layla production smoke test
on:
  push:
    paths:
      - 'backend/layla.js'
      - 'assets/tabaq-local-guide.js'
      - '.github/workflows/layla-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify production cloud conversation
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          urls=['https://www.houseoftabaq.com/api/layla','https://tabaq-final-website.vercel.app/api/layla']
          for url in urls:
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'TABAQ health monitor/1.0'}),timeout=12) as r:
                      health=json.load(r)
                  print(url, 'configuration', {k:health.get(k) for k in ['revision','cloudConfigured','groqConfigured']})
                  if not health.get('cloudConfigured'): continue
                  request=urllib.request.Request(url,data=json.dumps({'message':'Can you describe a perfume inspired by a rainy garden?','history':[]}).encode(),headers={'Content-Type':'application/json','Origin':url.split('/api/')[0],'User-Agent':'TABAQ health monitor/1.0'},method='POST')
                  with urllib.request.urlopen(request,timeout=25) as r:
                      result=json.load(r)
                  print(url,json.dumps({k:result.get(k) for k in ['mode','provider','model','gatewayStatus','groqStatus']}))
                  if result.get('reply') and result.get('mode')=='cloud':
                      print('Cloud generation verified through',url)
                      break
              except urllib.error.HTTPError as e:
                  print(url,'HTTP',e.code)
              except Exception as e:
                  print(url,type(e).__name__)
          else:
              raise SystemExit('Live model response unavailable or edge blocked')
          PY
